[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "commtrain"
version = "0.1.0"
description = "コミュニケーション訓練用の録音分析ツール(ローカル処理)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
commtrain = "commtrain.cli:main"

[tool.setuptools]
packages = ["commtrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
